services:
  dailytracker:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - dailytracker_data:/data
    environment:
      - DATA_DIR=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  dailytracker_data:
